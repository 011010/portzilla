name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # No `checks: write`: the audit used to run through rustsec/audit-check,
    # which created a check run via the Checks API and could fail on that call
    # alone ("Not Found" while updating the check run) even when the audit
    # itself was clean. The step now runs cargo-audit directly and lets its exit
    # code do the work, so the token only needs read access to the repository.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      # One tool covers what used to be two checks: RustSec advisories, license
      # policy, duplicate versions and dependency sources. `deny.toml` holds the
      # policy; see the comments there for why notices warn while vulnerabilities
      # fail.
      - name: Install cargo-deny
        # Pinned: the deny.toml schema changes between major versions.
        run: cargo install cargo-deny --locked --version 0.22.0

      - name: Check the dependency policy (advisories, licenses, bans, sources)
        run: cargo deny check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-targets --all-features
