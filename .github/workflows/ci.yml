name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # No `checks: write`: the audit used to run through rustsec/audit-check,
    # which created a check run via the Checks API and could fail on that call
    # alone ("Not Found" while updating the check run) even when the audit
    # itself was clean. The step now runs cargo-audit directly and lets its exit
    # code do the work, so the token only needs read access to the repository.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      # cargo-audit exits non-zero only for vulnerabilities; unmaintained and
      # unsound notices are warnings, which is the behaviour the previous
      # action had. Installing it here costs about as much as the action did
      # (it compiled the same tool) and removes the third-party wrapper.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies for security advisories (RustSec)
        run: cargo audit

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-targets --all-features
