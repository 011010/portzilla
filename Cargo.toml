[package]
name = "portzilla"
version = "0.3.0"
edition = "2024"
description = "Port and process lease coordinator for parallel AI coding-agent sessions"
license = "MIT"
readme = "README.md"
repository = "https://github.com/011010/portzilla"
homepage = "https://github.com/011010/portzilla"
keywords = ["port", "cli", "agent", "dev-tools", "process"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".atl/", ".github/", "docs/plans/", "npm/", "package.json", "scripts/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
fs4 = "1.1.0"
rmcp = { version = "3.1.1", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "signal", "time"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
